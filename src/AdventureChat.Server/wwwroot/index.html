<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Chat</title>
  <link rel="stylesheet" href="css/world-picker.css">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div id="app">
    <div id="game-container" hidden>
      <div id="game-toolbar">
        <button type="button" id="game-scale" aria-controls="game-container" aria-pressed="false">Auf Fenstergröße</button>
      </div>
      <canvas id="game-canvas" width="640" height="360"></canvas>
      <div id="action-bar" class="action-bar">
        <span id="action-text" class="action-text">Walk to</span>
        <span id="interactions" hidden>
          <label>Objekt <select id="interaction-object"></select></label>
          <label>Aktion <select id="interaction-action"></select></label>
          <button type="button" id="interaction-submit">Ausführen</button>
          <span id="interaction-feedback" role="status"></span>
        </span>
      </div>
      <div id="chat-container">
        <div id="chat-messages" class="chat-messages">
          <div class="chat-system-message">Willkommen im Adventure Chat. Klicke auf den Boden, um dich zu bewegen.</div>
        </div>
        <form id="chat-form" class="chat-input-bar">
          <input type="text" id="chat-input" placeholder="Nachricht eingeben..." maxlength="200" autocomplete="off" disabled>
          <button type="submit" id="chat-send" disabled>Senden</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/lib/signalr.min.js?v=4"></script>
  <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
