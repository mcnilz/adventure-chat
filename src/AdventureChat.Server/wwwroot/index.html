<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Chat</title>
  <link rel="stylesheet" href="css/world-picker.css">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <div id="app">
    <div id="game-container" hidden>
      <div id="game-toolbar">
        <button type="button" id="game-scale" aria-controls="game-container" aria-pressed="false">Auf Fenstergröße</button>
      </div>
      <canvas id="game-canvas" width="640" height="360"></canvas>
      <p id="npc-dialogue-bubble" hidden></p>
      <div id="action-bar" class="action-bar">
        <span id="action-text" class="action-text" role="status">Gehe zu</span>
        <span id="action-feedback" role="status"></span>
      </div>
      <nav id="verb-bar" aria-label="Verben">
        <button type="button" data-verb="walk" aria-pressed="true">Gehe zu</button>
        <button type="button" data-verb="open" aria-pressed="false">Öffnen</button>
        <button type="button" data-verb="close" aria-pressed="false">Schließen</button>
        <button type="button" data-verb="pull" aria-pressed="false">Ziehen</button>
        <button type="button" data-verb="push" aria-pressed="false">Drücken</button>
        <button type="button" data-verb="use" aria-pressed="false">Benutzen</button>
        <button type="button" data-verb="talk" aria-pressed="false">Spreche mit</button>
      </nav>
      <section id="npc-dialogue" aria-labelledby="npc-dialogue-name" hidden>
        <div class="npc-dialogue-header">
          <h2 id="npc-dialogue-name"></h2>
          <button type="button" id="npc-dialogue-close">Gespräch beenden</button>
        </div>
        <div class="npc-dialogue-body">
          <p id="npc-dialogue-notice" role="status" hidden></p>
          <div id="npc-choices"></div>
        </div>
        <p id="npc-reply" class="visually-hidden" role="status"></p>
      </section>
      <div id="chat-container">
        <div id="chat-messages" class="chat-messages">
          <div class="chat-system-message">Willkommen im Adventure Chat. Klicke auf den Boden, um dich zu bewegen.</div>
        </div>
        <form id="chat-form" class="chat-input-bar">
          <input type="text" id="chat-input" placeholder="Nachricht eingeben..." maxlength="200" autocomplete="off" disabled>
          <button type="submit" id="chat-send" disabled>Senden</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/lib/signalr.min.js?v=4"></script>
  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
