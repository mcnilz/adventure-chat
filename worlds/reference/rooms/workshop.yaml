version: 1
id: workshop
name: Werkstatt
background: assets/images/workshop.png
size: { width: 640, height: 360 }
actorHeight: 64
spawns:
  - { id: entry, position: { x: 94, y: 153 } }
  - { id: east, position: { x: 545, y: 320 } }
walkable:
  - id: floor
    points: [{ x: 10, y: 100 }, { x: 630, y: 100 }, { x: 630, y: 350 }, { x: 10, y: 350 }]
obstacles:
  - id: table-floor
    points: [{ x: 110, y: 174 }, { x: 209, y: 174 }, { x: 209, y: 189 }, { x: 110, y: 189 }]
exits:
  - id: to-garden
    position: { x: 49, y: 118 }
    radius: 18
    bounds: { x: 29, y: 8, width: 40, height: 100 }
    label: Garten
    target: { room: garden, spawn: from-workshop }
  - id: through-gate
    position: { x: 370, y: 108 }
    radius: 12
    bounds: { x: 320, y: 4, width: 100, height: 100 }
    label: Gartentor
    target: { room: garden, spawn: from-workshop }
objects:
  - id: worktable
    image: assets/images/garden-table.png
    position: { x: 100, y: 115 }
    size: { width: 119, height: 72 }
    depthY: 189
  - id: chair
    image: assets/images/workshop-chair.png
    position: { x: 148, y: 165 }
    size: { width: 40, height: 50 }
    depthY: 213
    usePoints: [{ x: 184, y: 246 }, { x: 218, y: 246 }]
    interaction:
      name: Stuhl
      initialState: table
      useRadius: 18
      states:
        - id: table
          name: Am Tisch
          image: assets/images/workshop-chair.png
          position: { x: 148, y: 165 }
          size: { width: 40, height: 50 }
          depthY: 213
          obstacles:
            - id: chair-floor
              points: [{ x: 153, y: 197 }, { x: 184, y: 197 }, { x: 184, y: 213 }, { x: 153, y: 213 }]
        - id: pulled
          name: Zurückgeschoben
          image: assets/images/workshop-chair.png
          position: { x: 204, y: 190 }
          size: { width: 40, height: 50 }
          depthY: 238
          obstacles:
            - id: chair-floor
              points: [{ x: 209, y: 222 }, { x: 240, y: 222 }, { x: 240, y: 238 }, { x: 209, y: 238 }]
      actions:
        - { id: pull, name: Ziehen, from: table, to: pulled }
        - { id: push, name: Drücken, from: pulled, to: table }
  - id: door
    image: assets/images/workshop-door-closed.png
    position: { x: 29, y: 8 }
    size: { width: 40, height: 100 }
    depthY: 108
    interaction:
      name: Tür
      initialState: closed
      usePoint: { x: 72, y: 136 }
      useRadius: 16
      states:
        - id: closed
          name: Geschlossen
          image: assets/images/workshop-door-closed.png
          position: { x: 29, y: 8 }
          size: { width: 40, height: 100 }
          depthY: 108
          blockedExits: [to-garden]
          obstacles:
            - id: door-sill
              points: [{ x: 29, y: 100 }, { x: 69, y: 100 }, { x: 69, y: 122 }, { x: 29, y: 122 }]
        - { id: open, name: Offen, image: assets/images/workshop-door-open.png, position: { x: 29, y: 8 }, size: { width: 40, height: 100 }, depthY: 108 }
      actions:
        - { id: open, name: Öffnen, from: closed, to: open }
        - { id: close, name: Schließen, from: open, to: closed }
  - id: switch
    image: assets/images/workshop-switch-off.png
    position: { x: 267, y: 55 }
    size: { width: 40, height: 40 }
    depthY: 95
    interaction:
      name: Torschalter
      initialState: off
      usePoint: { x: 287, y: 126 }
      useRadius: 18
      states:
        - { id: off, name: Aus, image: assets/images/workshop-switch-off.png, position: { x: 267, y: 55 }, size: { width: 40, height: 40 }, depthY: 95 }
        - { id: on, name: An, image: assets/images/workshop-switch-on.png, position: { x: 267, y: 55 }, size: { width: 40, height: 40 }, depthY: 95 }
      actions:
        - id: switch-on
          name: Einschalten
          from: off
          to: on
          effects: [{ room: workshop, object: gate, state: open }]
        - id: switch-off
          name: Ausschalten
          from: on
          to: off
          effects: [{ room: workshop, object: gate, state: closed }]
  - id: gate-view
    image: assets/images/workshop-gate-view.png
    position: { x: 334, y: 18 }
    size: { width: 72, height: 76 }
    depthY: 103
  - id: gate
    image: assets/images/workshop-gate-closed.png
    position: { x: 320, y: 4 }
    size: { width: 100, height: 100 }
    depthY: 104
    interaction:
      name: Gartentor
      initialState: closed
      usePoint: { x: 370, y: 139 }
      useRadius: 18
      states:
        - id: closed
          name: Geschlossen
          image: assets/images/workshop-gate-closed.png
          position: { x: 320, y: 4 }
          size: { width: 100, height: 100 }
          depthY: 104
          blockedExits: [through-gate]
          obstacles:
            - id: gate-sill
              points: [{ x: 325, y: 100 }, { x: 415, y: 100 }, { x: 415, y: 120 }, { x: 325, y: 120 }]
        - { id: open, name: Offen, image: assets/images/workshop-gate-open.png, position: { x: 320, y: 4 }, size: { width: 100, height: 100 }, depthY: 104 }
      actions:
        - id: close
          name: Schließen
          from: open
          to: closed
          effects: [{ room: workshop, object: switch, state: off }]
notes: Bei geöffnetem Tor kann eine Figur am unteren Rand der Schwelle (389,115) stehen. Ausschalten wird dann abgelehnt. Sichere Warteposition vor dem Tor (389,159).
