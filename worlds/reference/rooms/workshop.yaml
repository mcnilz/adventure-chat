version: 1
id: workshop
name: Werkstatt
background: assets/images/workshop.png
size: { width: 640, height: 360 }
actorHeight: 64
spawns:
  - { id: entry, position: { x: 94, y: 153 } }
  - { id: east, position: { x: 545, y: 320 } }
walkable:
  - id: floor
    points: [{ x: 10, y: 100 }, { x: 630, y: 100 }, { x: 630, y: 350 }, { x: 10, y: 350 }]
obstacles:
  - id: table-floor
    points: [{ x: 110, y: 174 }, { x: 209, y: 174 }, { x: 209, y: 189 }, { x: 110, y: 189 }]
  - id: lift-floor
    points: [{ x: 469, y: 215 }, { x: 574, y: 215 }, { x: 574, y: 224 }, { x: 469, y: 224 }]
exits:
  - id: to-garden
    position: { x: 49, y: 118 }
    radius: 18
    bounds: { x: 29, y: 8, width: 40, height: 100 }
    label: Garten
    target: { room: garden, spawn: from-workshop }
  - id: through-gate
    position: { x: 370, y: 108 }
    radius: 12
    bounds: { x: 320, y: 4, width: 100, height: 100 }
    label: Gartentor
    target: { room: garden, spawn: from-workshop }
objects:
  - id: worktable
    image: assets/images/garden-table.png
    position: { x: 100, y: 115 }
    size: { width: 119, height: 72 }
    depthY: 189
  - id: chair
    image: assets/images/workshop-chair.png
    position: { x: 148, y: 165 }
    size: { width: 40, height: 50 }
    depthY: 213
    usePoints: [{ x: 184, y: 246 }, { x: 218, y: 246 }]
    interaction:
      name: Stuhl
      initialState: table
      useRadius: 18
      states:
        - id: table
          name: Am Tisch
          image: assets/images/workshop-chair.png
          position: { x: 148, y: 165 }
          size: { width: 40, height: 50 }
          depthY: 213
          obstacles:
            - id: chair-floor
              points: [{ x: 153, y: 197 }, { x: 184, y: 197 }, { x: 184, y: 213 }, { x: 153, y: 213 }]
        - id: pulled
          name: Zurückgeschoben
          image: assets/images/workshop-chair.png
          position: { x: 204, y: 190 }
          size: { width: 40, height: 50 }
          depthY: 238
          obstacles:
            - id: chair-floor
              points: [{ x: 209, y: 222 }, { x: 240, y: 222 }, { x: 240, y: 238 }, { x: 209, y: 238 }]
      actions:
        - { id: pull, name: Ziehen, from: table, to: pulled }
        - { id: push, name: Drücken, from: pulled, to: table }
        - id: sit
          name: Benutzen
          from: pulled
          to: pulled
          actorAnimation:
            point: 1
            direction: down
            sprites: { mara: assets/images/workshop-mara-seated.png, bruno: assets/images/workshop-bruno-seated.png }
  - id: board
    image: assets/images/workshop-board-empty.png
    position: { x: 96, y: 22 }
    size: { width: 82, height: 56 }
    depthY: 78
    interaction:
      name: Werkstatttafel
      initialState: empty
      usePoint: { x: 175, y: 130 }
      useRadius: 20
      states:
        - { id: empty, name: Leer, image: assets/images/workshop-board-empty.png, position: { x: 96, y: 22 }, size: { width: 82, height: 56 }, depthY: 78 }
        - { id: written, name: Beschriftet, image: assets/images/workshop-board-written.png, position: { x: 96, y: 22 }, size: { width: 82, height: 56 }, depthY: 78 }
      actions:
        - id: show-plan
          name: Benutzen
          from: empty
          to: written
          actorAnimation:
            point: 0
            direction: up
            durationMs: 1500
            sprites: { mara: assets/images/workshop-mara-gesture.png, bruno: assets/images/workshop-bruno-gesture.png }
        - { id: clear-plan, name: Benutzen, from: written, to: empty }
  - id: door
    image: assets/images/workshop-door-closed.png
    position: { x: 29, y: 8 }
    size: { width: 40, height: 100 }
    depthY: 108
    interaction:
      name: Tür
      initialState: closed
      usePoint: { x: 72, y: 136 }
      useRadius: 16
      states:
        - id: closed
          name: Geschlossen
          image: assets/images/workshop-door-closed.png
          position: { x: 29, y: 8 }
          size: { width: 40, height: 100 }
          depthY: 108
          blockedExits: [to-garden]
          obstacles:
            - id: door-sill
              points: [{ x: 29, y: 100 }, { x: 69, y: 100 }, { x: 69, y: 122 }, { x: 29, y: 122 }]
        - { id: open, name: Offen, image: assets/images/workshop-door-open.png, position: { x: 29, y: 8 }, size: { width: 40, height: 100 }, depthY: 108 }
      actions:
        - { id: open, name: Öffnen, from: closed, to: open }
        - { id: close, name: Schließen, from: open, to: closed }
  - id: switch
    image: assets/images/workshop-switch-off.png
    position: { x: 267, y: 55 }
    size: { width: 40, height: 40 }
    depthY: 95
    interaction:
      name: Torschalter
      initialState: off
      usePoint: { x: 287, y: 126 }
      useRadius: 18
      states:
        - { id: off, name: Aus, image: assets/images/workshop-switch-off.png, position: { x: 267, y: 55 }, size: { width: 40, height: 40 }, depthY: 95 }
        - { id: on, name: An, image: assets/images/workshop-switch-on.png, position: { x: 267, y: 55 }, size: { width: 40, height: 40 }, depthY: 95 }
      actions:
        - id: switch-on
          name: Einschalten
          from: off
          to: on
          effects: [{ room: workshop, object: gate, state: open }]
        - id: switch-off
          name: Ausschalten
          from: on
          to: off
          effects: [{ room: workshop, object: gate, state: closed }]
  - id: gate-view
    image: assets/images/workshop-gate-view.png
    position: { x: 334, y: 18 }
    size: { width: 72, height: 76 }
    depthY: 103
  - id: gate
    image: assets/images/workshop-gate-closed.png
    position: { x: 320, y: 4 }
    size: { width: 100, height: 100 }
    depthY: 104
    interaction:
      name: Gartentor
      initialState: closed
      usePoint: { x: 370, y: 139 }
      useRadius: 18
      states:
        - id: closed
          name: Geschlossen
          image: assets/images/workshop-gate-closed.png
          position: { x: 320, y: 4 }
          size: { width: 100, height: 100 }
          depthY: 104
          blockedExits: [through-gate]
          obstacles:
            - id: gate-sill
              points: [{ x: 325, y: 100 }, { x: 415, y: 100 }, { x: 415, y: 120 }, { x: 325, y: 120 }]
        - { id: open, name: Offen, image: assets/images/workshop-gate-open.png, position: { x: 320, y: 4 }, size: { width: 100, height: 100 }, depthY: 104 }
      actions:
        - id: close
          name: Schließen
          from: open
          to: closed
          effects: [{ room: workshop, object: switch, state: off }]
  - id: lift-base
    image: assets/images/workshop-lift-base.png
    position: { x: 465, y: 132 }
    size: { width: 112, height: 92 }
    depthY: 224
  - id: lift-plate
    image: assets/images/workshop-lift-plate.png
    position: { x: 465, y: 177 }
    size: { width: 112, height: 24 }
    depthY: 224
    interaction:
      name: Hubtischplatte
      initialState: lowered
      usePoint: { x: 521, y: 240 }
      useRadius: 20
      states:
        - { id: lowered, name: Unten, image: assets/images/workshop-lift-plate.png, position: { x: 465, y: 177 }, size: { width: 112, height: 24 }, depthY: 224 }
        - { id: raised, name: Oben, image: assets/images/workshop-lift-plate.png, position: { x: 465, y: 132 }, size: { width: 112, height: 24 }, depthY: 224 }
      actions: []
      transitions:
        - { from: lowered, to: raised, durationMs: 1800 }
        - { from: raised, to: lowered, durationMs: 1400 }
  - id: lift-up
    image: assets/images/workshop-lift-up.png
    position: { x: 482, y: 65 }
    size: { width: 27, height: 28 }
    depthY: 93
    interaction:
      name: Hubtaste Auf
      initialState: ready
      usePoint: { x: 495, y: 116 }
      useRadius: 24
      states:
        - { id: ready, name: Bereit, image: assets/images/workshop-lift-up.png, position: { x: 482, y: 65 }, size: { width: 27, height: 28 }, depthY: 93 }
      actions:
        - id: raise
          name: Drücken
          from: ready
          to: ready
          effects: [{ room: workshop, object: lift-plate, state: raised }]
  - id: lift-down
    image: assets/images/workshop-lift-down.png
    position: { x: 517, y: 65 }
    size: { width: 27, height: 28 }
    depthY: 93
    interaction:
      name: Hubtaste Ab
      initialState: ready
      usePoint: { x: 530, y: 116 }
      useRadius: 24
      states:
        - { id: ready, name: Bereit, image: assets/images/workshop-lift-down.png, position: { x: 517, y: 65 }, size: { width: 27, height: 28 }, depthY: 93 }
      actions:
        - id: lower
          name: Drücken
          from: ready
          to: ready
          effects: [{ room: workshop, object: lift-plate, state: lowered }]
notes: Bei geöffnetem Tor kann eine Figur am unteren Rand der Schwelle (389,115) stehen. Ausschalten wird dann abgelehnt. Sichere Warteposition vor dem Tor (389,159). Die beiden Hubtasten rechts bewegen dieselbe Tischplatte. Benutzen am zurückgeschobenen Stuhl setzt die Figur hin; Benutzen an der Tafel zeigt den Werkstattplan.
