version: 1
id: lounge
name: Lounge
background: assets/images/lounge-runtime.png
size: { width: 640, height: 360 }
actorHeight: 128
spawns:
  - { id: entry, position: { x: 180, y: 320 } }
  - { id: from-garden, position: { x: 564, y: 254 } }
npcs:
  - id: nela
    name: Nela
    characterId: bruno
    position: { x: 112, y: 286 }
    talkPoint: { x: 146, y: 294 }
    followDistance: 48
    tour:
      - { position: { x: 205, y: 326 }, text: In der Lounge treffen sich die Gäste. An der Klingel kannst du mich rufen. }
      - { exit: to-garden }
      - { position: { x: 224, y: 294 }, text: Hier ist der Tavernen-Garten. Am Tisch kannst du dich mit anderen Gästen unterhalten. }
    options:
      - id: introduction
        text: Wer bist du?
        reply: Ich bin Nela. Ich passe auf die Lounge auf.
        replies:
          - { when: { object: bell, state: rung }, reply: Ich bin Nela und helfe dir gern. }
      - { id: garden, text: Wo ist der Garten?, reply: Durch die Tür rechts erreichst du den Tavernen-Garten. }
      - id: bell
        text: Hast du die Klingel gehört?
        reply: Ja, ich habe deinen Ruf gehört.
        when: { object: bell, state: rung }
walkable:
  - id: floor
    points: [{ x: 76, y: 242 }, { x: 284, y: 222 }, { x: 510, y: 222 }, { x: 532, y: 236 }, { x: 616, y: 236 }, { x: 616, y: 348 }, { x: 76, y: 348 }]
obstacles:
  - id: table
    points: [{ x: 238, y: 270 }, { x: 422, y: 270 }, { x: 422, y: 306 }, { x: 238, y: 306 }]
objects:
  - id: bell
    image: assets/images/lounge-bell-ready.png
    position: { x: 187, y: 224 }
    size: { width: 32, height: 51 }
    depthY: 272
    interaction:
      name: Klingel
      initialState: ready
      usePoint: { x: 203, y: 289 }
      useRadius: 18
      states:
        - { id: ready, name: Bereit, image: assets/images/lounge-bell-ready.png, position: { x: 187, y: 224 }, size: { width: 32, height: 51 }, depthY: 272 }
        - { id: rung, name: Gerufen, image: assets/images/lounge-bell-rung.png, position: { x: 187, y: 224 }, size: { width: 32, height: 51 }, depthY: 272 }
      actions:
        - { id: ring, name: Drücken, from: ready, to: rung }
        - { id: reset, name: Drücken, from: rung, to: ready }
  - id: table
    image: assets/images/lounge-table.png
    position: { x: 238, y: 224 }
    size: { width: 184, height: 82 }
    depthY: 306
exits:
  - id: to-garden
    position: { x: 572, y: 244 }
    radius: 28
    bounds: { x: 528, y: 64, width: 90, height: 182 }
    label: Tavernen-Garten
    target: { room: garden, spawn: from-lounge }
notes: Tisch hinten bei (330,258), davor bei (330,330). Kollision am Bodenfußabdruck; Tischplatte überragt ihn.
